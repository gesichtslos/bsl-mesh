name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: bslmesh_admin
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: bslmesh_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bslmesh_admin -d bslmesh_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Scan tracked files for high-confidence secrets
        run: node scripts/scan-secrets.mjs
      - name: Scan commits that this push would publish
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/scan-secrets.mjs --push-range "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            node scripts/scan-secrets.mjs --push-range "${{ github.event.before }}" "${{ github.sha }}"
          fi
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Toolchain
        run: pnpm toolchain
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build && node scripts/pack-tool-release.mjs
      - name: Ensure application role
        run: pnpm ensure:db-roles
        env:
          ADMIN_DATABASE_URL: postgres://bslmesh_admin:ci-disposable@127.0.0.1:5432/postgres
          POSTGRES_PASSWORD: ci-disposable
          APP_PASSWORD: ci-disposable-app
          PGHOST: 127.0.0.1
          PGPORT: "5432"
      - name: Prepare disposable test database
        run: pnpm prepare:test-db
        env:
          NODE_ENV: test
          ADMIN_DATABASE_URL: postgres://bslmesh_admin:ci-disposable@127.0.0.1:5432/postgres
          POSTGRES_PASSWORD: ci-disposable
          APP_PASSWORD: ci-disposable-app
          DATABASE_URL: postgres://bslmesh_app:ci-disposable-app@127.0.0.1:5432/bslmesh_dev
          TEST_DATABASE_URL: postgres://bslmesh_tester:ci-disposable-test@127.0.0.1:5432/bslmesh_test
      - name: Integration tests
        run: pnpm test:integration
        env:
          NODE_ENV: test
          ADMIN_DATABASE_URL: postgres://bslmesh_admin:ci-disposable@127.0.0.1:5432/postgres
          DATABASE_URL: postgres://bslmesh_app:ci-disposable-app@127.0.0.1:5432/bslmesh_dev
          TEST_DATABASE_URL: postgres://bslmesh_tester:ci-disposable-test@127.0.0.1:5432/bslmesh_test
          PGUSER: bslmesh_app
          PGPASSWORD: ci-disposable-app
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: bslmesh_dev

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the application image
        run: docker build -t bsl-mesh-app:ci .
      - name: Check the security manifest is in the image and other docs are not
        run: |
          docker run --rm --user root --entrypoint sh bsl-mesh-app:ci -c 'test -s docs/08-CLIENT-SECURITY-MANIFEST.md && test ! -e docs/00-VISION.md && test ! -e .env && test ! -e backups && test ! -e secrets && test -s docker/production-migrate.sh && test -s build/tool-release/cursor-adapter-linux.zip && node --input-type=module -e "import { loadToolRelease } from \"./dist/tools/release.js\"; await loadToolRelease(\"build/tool-release\"); process.stdout.write(\"release-ok\\n\")"'
      - name: Check production Compose and Caddy without publishing ports
        run: |
          umask 077
          cat > "${RUNNER_TEMP}/production.env" << 'EOF'
          POSTGRES_PASSWORD=ci-disposable
          APP_PASSWORD=ci-disposable-app
          MIGRATE_PASSWORD=ci-disposable-migrator
          CADDY_ACME_EMAIL=tls-notices@example.test
          EOF
          docker compose --env-file "${RUNNER_TEMP}/production.env" -f compose.production.yaml config --format json > "${RUNNER_TEMP}/production-compose.json"
          docker run --rm -v "$PWD/Caddyfile.production:/etc/caddy/Caddyfile:ro" -e CADDY_ACME_EMAIL=tls-notices@example.test caddy:2.11.7 caddy adapt --config /etc/caddy/Caddyfile --pretty > "${RUNNER_TEMP}/caddy.json"
          CHECK_POSTGRES_PASSWORD=ci-disposable node scripts/check-production-config.mjs "${RUNNER_TEMP}/production-compose.json" "${RUNNER_TEMP}/caddy.json"
          HANDOFF_ENABLED=enabled docker compose --env-file "${RUNNER_TEMP}/production.env" -f compose.production.yaml config --format json > "${RUNNER_TEMP}/production-compose-handoff.json"
          CHECK_POSTGRES_PASSWORD=ci-disposable CHECK_HANDOFF_ENABLED=enabled node scripts/check-production-config.mjs "${RUNNER_TEMP}/production-compose-handoff.json" "${RUNNER_TEMP}/caddy.json"
          bash scripts/production-backup.sh --self-test
          set +e
          bash scripts/production-backup.sh > "${RUNNER_TEMP}/backup-refusal.txt" 2>&1
          status=$?
          set -e
          test "${status}" -eq 2
          grep -q BACKUP_S3_ENDPOINT "${RUNNER_TEMP}/backup-refusal.txt"
      - name: Rehearse encrypted backup against local S3
        run: bash scripts/production-backup-rehearsal.sh
