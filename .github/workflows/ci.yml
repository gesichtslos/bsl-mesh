name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: bslmesh_admin
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: bslmesh_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bslmesh_admin -d bslmesh_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Scan tracked files for high-confidence secrets
        run: node scripts/scan-secrets.mjs
      - name: Scan commits that this push would publish
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/scan-secrets.mjs --push-range "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            node scripts/scan-secrets.mjs --push-range "${{ github.event.before }}" "${{ github.sha }}"
          fi
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Toolchain
        run: pnpm toolchain
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Ensure application role
        run: pnpm ensure:db-roles
        env:
          ADMIN_DATABASE_URL: postgres://bslmesh_admin:ci-disposable@127.0.0.1:5432/postgres
          POSTGRES_PASSWORD: ci-disposable
          APP_PASSWORD: ci-disposable-app
          PGHOST: 127.0.0.1
          PGPORT: "5432"
      - name: Prepare disposable test database
        run: pnpm prepare:test-db
        env:
          NODE_ENV: test
          ADMIN_DATABASE_URL: postgres://bslmesh_admin:ci-disposable@127.0.0.1:5432/postgres
          POSTGRES_PASSWORD: ci-disposable
          APP_PASSWORD: ci-disposable-app
          DATABASE_URL: postgres://bslmesh_app:ci-disposable-app@127.0.0.1:5432/bslmesh_dev
          TEST_DATABASE_URL: postgres://bslmesh_tester:ci-disposable-test@127.0.0.1:5432/bslmesh_test
      - name: Integration tests
        run: pnpm test:integration
        env:
          NODE_ENV: test
          ADMIN_DATABASE_URL: postgres://bslmesh_admin:ci-disposable@127.0.0.1:5432/postgres
          DATABASE_URL: postgres://bslmesh_app:ci-disposable-app@127.0.0.1:5432/bslmesh_dev
          TEST_DATABASE_URL: postgres://bslmesh_tester:ci-disposable-test@127.0.0.1:5432/bslmesh_test
          PGUSER: bslmesh_app
          PGPASSWORD: ci-disposable-app
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: bslmesh_dev

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build -t bsl-mesh-app:ci .
      - name: Check the security manifest is in the image and other docs are not
        run: |
          docker run --rm --user root --entrypoint sh bsl-mesh-app:ci -c 'test -s docs/08-CLIENT-SECURITY-MANIFEST.md && test ! -e docs/00-VISION.md && test ! -e .env && test ! -e backups && test ! -e secrets'
