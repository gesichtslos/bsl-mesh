# Staging overlay. Validate with `docker compose -f compose.staging.yaml config`.
# Do not start this file until an operator approves the staging host.
# Caddy uses internal TLS so this file does not request a public certificate.
name: bsl-mesh-staging

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: bslmesh_dev
      POSTGRES_USER: bslmesh_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in untracked .env}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in untracked .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bslmesh_admin -d bslmesh_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    image: ${APP_IMAGE:-bsl-mesh-app:0.1.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PGUSER: bslmesh_app
      PGPASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in untracked .env}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: bslmesh_dev
      LOG_LEVEL: info
      NODE_ENV: production
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  caddy-data:
  caddy-config:
