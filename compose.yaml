name: bsl-mesh

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: bslmesh_dev
      POSTGRES_USER: bslmesh_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in untracked .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bslmesh_dev -d bslmesh_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    image: ${APP_IMAGE:-bsl-mesh-app:0.1.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://bslmesh_dev:${POSTGRES_PASSWORD}@db:5432/bslmesh_dev
      LOG_LEVEL: info
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
